[package]
name = "gpg-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sequoia-openpgp = { version = "2", default-features = false, features = [
    "crypto-rust",
    "allow-experimental-crypto",
    # Required for WASM: RustCrypto backend can't guarantee constant-time on wasm32.
    # The browser's same-origin policy + extension sandboxing mitigate timing attacks.
    "allow-variable-time-crypto",
    "compression-deflate",
] }
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Both versions needed: sequoia's deps use both getrandom v0.2 and v0.3
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
anyhow = "1"
# Argon2id for the vault KDF (`argon2_derive`). Only `hash_password_into`
# is used, so the PHC-string / password-hash / getrandom defaults are off;
# `alloc` provides that method and `zeroize` wipes argon2's internal hash
# state. SECOND COPY: sequoia still pulls argon2 0.5 for OpenPGP's Argon2
# S2K, so 0.5.x stays in Cargo.lock; this 0.6 copy is used only by our
# standalone vault code. Output is pinned by `kat_argon2id_*` in
# `src/kat_tests.rs` -- a byte of drift would lock users out of vaults.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
# `aes` + `cfb-mode` (cipher 0.5 generation) for the CFB fallback that
# decrypts GnuPG's zero-padded ECC secret keys (see cfb_decrypt). The mode
# is a library implementation, never hand-rolled here. SECOND COPY: sequoia
# (and age / ssh-key via aes-gcm 0.10) still pull aes 0.8 + cfb-mode 0.8 +
# cipher 0.4, which stay in Cargo.lock; these newer copies are used only by
# cfb_decrypt (and aes by the vault's aes-gcm below). `zeroize` is on for
# both: it wipes the AES key schedule and the CFB register on drop (aes 0.8
# already had it, enabled by another crate; 0.9 needs it asked for).
# Pinned by `kat_cfb128_*` in `src/kat_tests.rs` (NIST SP 800-38A).
aes = { version = "0.9", features = ["zeroize"] }
cfb-mode = { version = "0.9", features = ["zeroize"] }
# Constant-time equality for the secret-key checksum and SHA-1 digest,
# which are what decide "was the passphrase correct". Already in
# Cargo.lock at 2.6.1 (sequoia, aes-gcm 0.10, rsa and curve25519 all pull it).
subtle = "2.6"
# Vault envelope: AES-256-GCM (`aes_gcm_encrypt`/`aes_gcm_decrypt`) and
# HKDF-SHA256 (PRF unlock, contacts key, store subkeys). Standalone code --
# no trait crosses into sequoia/rsa/ssh-key -- so these track the newest
# RustCrypto generation (aead 0.6 / cipher 0.5 / digest 0.11). SECOND COPY:
# sequoia, age and ssh-key still pull aes-gcm 0.10, hkdf 0.12, hmac 0.12
# and sha2 0.10, which stay in Cargo.lock. aes-gcm defaults are off so it
# never pulls `getrandom` (we draw nonces from `src/rng.rs`); `zeroize`
# makes `Aes256Gcm` ZeroizeOnDrop (AES key schedule + GHASH key), on top
# of the explicit `zeroize_cipher` wipe. sha2 0.11 was already compiled
# into the wasm via age's rust-embed, so it adds no crate. All of it is
# pinned byte-for-byte by `src/kat_tests.rs`.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
hkdf = "0.13"
sha2 = { version = "0.11", default-features = false }
zeroize = { version = "1", features = ["derive"] }
# CRX (Chrome extension) signing. All already resolved transitively via
# sequoia's crypto-rust backend -- declaring them direct adds no new build.
# The CRX SHA-256 must implement rsa 0.9's digest-0.10 traits
# (`Pkcs1v15Sign::new::<Sha256>` needs `AssociatedOid`), so `src/crx.rs`
# takes it from `rsa::sha2` (the `sha2` feature: sha2 0.10 + `oid`, the copy
# sequoia already builds) rather than the 0.11 `sha2` above.
rsa = { version = "0.9", features = ["std", "pem", "sha2"] }
rand_core = "0.6"
# NEW DIRECT DEPENDENCY: ChaCha20 CSPRNG for `src/rng.rs`. Already in
# Cargo.lock at 0.3.1 via sequoia's `rand 0.8`, so this adds no crate to
# the build graph -- it makes an existing transitive dep direct. Pinned to
# the rand_core 0.6 line, matching `rand_core` and `rsa` above.
# Deliberately NOT bumped to rand_core 0.10 / rand_chacha 0.10: `VaultRng`
# is handed to rsa 0.9's keygen, which takes a rand_core 0.6 `RngCore +
# CryptoRng`; a newer line would need an adapter shim. Revisit with rsa 0.10.
rand_chacha = "0.3"
base64 = "0.22"

# age encryption to SSH recipients (`src/age.rs`). `armor` gives the
# `-----BEGIN AGE ENCRYPTED FILE-----` form; `ssh` gives the ssh-ed25519 /
# ssh-rsa recipient + identity stanzas. No default features are enabled
# (age's default set is empty; stated explicitly so a future default gains
# nothing implicitly).
age = { version = "0.12", default-features = false, features = ["ssh", "armor"] }
# RustCrypto OpenSSH key parser. Required because age 0.12 offers no way to
# unwrap a passphrase-protected SSH key into reusable material -- see the
# "Why ssh-key" section of `src/age.rs`. `encryption` brings bcrypt-pbkdf +
# the OpenSSH ciphers so we can decrypt at import; `ecdsa` is enabled only so
# an ECDSA key parses far enough to be *named* in its rejection message.
ssh-key = { version = "0.6", default-features = false, features = [
    "std",
    "ecdsa",
    "ed25519",
    "rsa",
    "encryption",
] }

[profile.release]
opt-level = "s"
lto = true
