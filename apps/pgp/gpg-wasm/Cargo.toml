[package]
name = "gpg-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sequoia-openpgp = { version = "2", default-features = false, features = [
    "crypto-rust",
    "allow-experimental-crypto",
    # Required for WASM: RustCrypto backend can't guarantee constant-time on wasm32.
    # The browser's same-origin policy + extension sandboxing mitigate timing attacks.
    "allow-variable-time-crypto",
    "compression-deflate",
] }
wasm-bindgen = "=0.2.100"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Both versions needed: sequoia's deps use both getrandom v0.2 and v0.3
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
anyhow = "1"
argon2 = "0.5"
# `aes` also comes in via aes-gcm; declared direct for the CFB fallback
# that decrypts GnuPG's zero-padded ECC secret keys (see cfb_decrypt).
aes = "0.8"
# CFB-128 for that same fallback. The mode is a library implementation,
# never hand-rolled here. Already in Cargo.lock at 0.8.2 via sequoia's
# crypto-rust backend, so declaring it direct adds no crate to the build
# graph -- the same precedent as `aes`/`rsa`/`rand_chacha` above.
cfb-mode = "0.8"
# Constant-time equality for the secret-key checksum and SHA-1 digest,
# which are what decide "was the passphrase correct". Already in
# Cargo.lock at 2.6.1 (sequoia, aes-gcm, rsa and curve25519 all pull it).
subtle = "2.6"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
zeroize = { version = "1", features = ["derive"] }
# CRX (Chrome extension) signing. All already resolved transitively via
# sequoia's crypto-rust backend -- declaring them direct adds no new build.
rsa = { version = "0.9", features = ["std", "pem"] }
rand_core = "0.6"
# NEW DIRECT DEPENDENCY: ChaCha20 CSPRNG for `src/rng.rs`. Already in
# Cargo.lock at 0.3.1 via sequoia's `rand 0.8`, so this adds no crate to
# the build graph -- it makes an existing transitive dep direct. Pinned to
# the rand_core 0.6 line, matching `rand_core` and `rsa` above.
rand_chacha = "0.3"
base64 = "0.22"

# age encryption to SSH recipients (`src/age.rs`). `armor` gives the
# `-----BEGIN AGE ENCRYPTED FILE-----` form; `ssh` gives the ssh-ed25519 /
# ssh-rsa recipient + identity stanzas. No default features are enabled
# (age's default set is empty; stated explicitly so a future default gains
# nothing implicitly).
age = { version = "0.12", default-features = false, features = ["ssh", "armor"] }
# RustCrypto OpenSSH key parser. Required because age 0.12 offers no way to
# unwrap a passphrase-protected SSH key into reusable material -- see the
# "Why ssh-key" section of `src/age.rs`. `encryption` brings bcrypt-pbkdf +
# the OpenSSH ciphers so we can decrypt at import; `ecdsa` is enabled only so
# an ECDSA key parses far enough to be *named* in its rejection message.
ssh-key = { version = "0.6", default-features = false, features = [
    "std",
    "ecdsa",
    "ed25519",
    "rsa",
    "encryption",
] }

[profile.release]
opt-level = "s"
lto = true
