packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  '@eslint/js': ^9.39.5
  '@tailwindcss/postcss': ^4.3.3
  '@tailwindcss/vite': 4.3.3
  '@types/node': ^22.20.5
  eslint: ^9.39.5
  prettier: ^3.9.10
  tailwindcss: 4.3.3
  typescript: ^5.9.3
  zod: ^4.4.3

catalogs:
  react19:
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    react: ^19.3.1
    react-dom: ^19.3.1

linkWorkspacePackages: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

overrides:
  esbuild: ^0.28.2
  lightningcss: 1.30.1

publicHoistPattern:
  - '@ianvs/prettier-plugin-sort-imports'
  - prettier-plugin-tailwindcss
