packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  '@eslint/js': ^10.0.1
  '@tailwindcss/postcss': ^4.3.3
  '@tailwindcss/vite': 4.3.3
  '@types/node': ^26.6.5
  eslint: ^10.13.0
  prettier: ^3.9.10
  tailwindcss: 4.3.3
  typescript: ^6.0.3
  zod: ^4.4.3

catalogs:
  react19:
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    react: ^19.3.1
    react-dom: ^19.3.1

linkWorkspacePackages: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

overrides:
  esbuild: ^0.28.2
  lightningcss: 1.30.1

publicHoistPattern:
  - '@ianvs/prettier-plugin-sort-imports'
  - prettier-plugin-tailwindcss
