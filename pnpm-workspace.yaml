packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  '@eslint/js': ^9.39.4
  '@tailwindcss/postcss': ^4.3.2
  '@tailwindcss/vite': 4.3.2
  '@types/node': ^22.20.0
  eslint: ^9.39.4
  prettier: ^3.9.4
  tailwindcss: 4.3.2
  typescript: ^5.9.3
  zod: ^4.4.3

catalogs:
  react19:
    '@types/react': ^19.2.17
    '@types/react-dom': ^19.2.3
    react: ^19.2.7
    react-dom: ^19.2.7

linkWorkspacePackages: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

overrides:
  lightningcss: 1.30.1

publicHoistPattern:
  - '@ianvs/prettier-plugin-sort-imports'
  - prettier-plugin-tailwindcss
