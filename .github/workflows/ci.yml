name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Build & E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/pgp/gpg-wasm

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM module
        working-directory: apps/pgp/gpg-wasm
        run: wasm-pack build --target web --release

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turbo's cache is per-machine, and a CI runner is a fresh machine
      # every time -- without this every task is a guaranteed miss and the
      # pipeline's caching does nothing here. Keyed on the commit so each
      # run writes its own entry, with a branch-then-global fallback so a
      # run still starts from the most recent cache it can find.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # The crypto core's own tests: KEY_STORE isolation, AAD domain
      # separation, the unlock canary, ciphertext integrity under
      # corruption, and the decompression-bomb caps. They guard the
      # properties SECURITY.md claims, so they gate a merge rather than
      # only existing. Release mode because the RSA keygen test is ~60s
      # of the debug run and a few seconds of the release one; the
      # compile is cached by rust-cache above, and turbo skips the whole
      # task when nothing under gpg-wasm/ changed.
      - run: pnpm test:rust

      - run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgp-tools-chrome-mv3
          path: apps/pgp/.output/chrome-mv3

      # E2E drives the built extension (.output/chrome-mv3, from `pnpm build`
      # above) in real Chromium via Playwright's new headless mode, which
      # loads extensions with no display/xvfb needed.
      - name: Install Playwright Chromium
        working-directory: apps/pgp
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e

      # The README's badge row is generated from measured values, never
      # typed. This re-measures and fails if the committed row has
      # drifted -- a badge is a claim in the first screenful, so it must
      # not be able to go quietly stale. It runs here, after the
      # Playwright install, because counting the e2e tests goes through
      # `playwright test --list`.
      #
      # Through turbo, so it reuses the coverage `pnpm test` above already
      # produced rather than running the unit suite a second time. The
      # task names the root README.md as an input, so a hand-edited badge
      # still busts the cache and fails here.
      - name: Check README badges are current
        run: pnpm badges:check

      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/pgp/test-results
          retention-days: 7
