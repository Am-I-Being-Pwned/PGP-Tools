name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token for every job: nothing here pushes, comments or
# publishes. Widen per job, never here, if a step ever needs more.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (a tag can be moved
# to new code; a SHA cannot), with the version they resolved to alongside.

jobs:
  ci:
    name: Lint, Typecheck, Build & E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Don't leave the token in .git/config for every later step (and
        # every dependency's install script) to read. Nothing below
        # talks to the remote.
        with:
          persist-credentials: false

      # Pinned by SHA, so the toolchain can no longer come from the ref
      # name (`@stable`) and is named explicitly instead.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/pgp/gpg-wasm

      # Built from crates.io against its lockfile rather than piping a
      # downloaded script into sh. 0.13.1 is the version that installer
      # pinned. rust-cache keeps ~/.cargo/bin, so this is a no-op on a hit.
      - name: Install wasm-pack
        # The runner image (or the restored cargo cache) may already have a
        # wasm-pack in ~/.cargo/bin, and `cargo install` refuses to overwrite
        # it. Keep it only if it is the pinned version; otherwise replace it.
        run: |
          if wasm-pack --version 2>/dev/null | grep -qx 'wasm-pack 0.13.1'; then
            echo "wasm-pack 0.13.1 already installed"
          else
            cargo install wasm-pack --locked --version 0.13.1 --force
          fi

      - name: Build WASM module
        working-directory: apps/pgp/gpg-wasm
        run: wasm-pack build --target web --release

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turbo's cache is per-machine, and a CI runner is a fresh machine
      # every time -- without this every task is a guaranteed miss and the
      # pipeline's caching does nothing here. Keyed on the commit so each
      # run writes its own entry, with a branch-then-global fallback so a
      # run still starts from the most recent cache it can find.
      - name: Restore turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # The crypto core's own tests: KEY_STORE isolation, AAD domain
      # separation, the unlock canary, ciphertext integrity under
      # corruption, and the decompression-bomb caps. They guard the
      # properties SECURITY.md claims, so they gate a merge rather than
      # only existing. Release mode because the RSA keygen test is ~60s
      # of the debug run and a few seconds of the release one; the
      # compile is cached by rust-cache above, and turbo skips the whole
      # task when nothing under gpg-wasm/ changed.
      - run: pnpm test:rust

      - run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pgp-tools-chrome-mv3
          path: apps/pgp/.output/chrome-mv3

      # E2E drives the built extension (.output/chrome-mv3, from `pnpm build`
      # above) in real Chromium via Playwright's new headless mode, which
      # loads extensions with no display/xvfb needed.
      - name: Install Playwright Chromium
        working-directory: apps/pgp
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e

      # The README's badge row is generated from measured values, never
      # typed. This re-measures and fails if the committed row has
      # drifted -- a badge is a claim in the first screenful, so it must
      # not be able to go quietly stale. It runs here, after the
      # Playwright install, because counting the e2e tests goes through
      # `playwright test --list`.
      #
      # Through turbo, so it reuses the coverage `pnpm test` above already
      # produced rather than running the unit suite a second time. The
      # task names the root README.md as an input, so a hand-edited badge
      # still busts the cache and fails here.
      - name: Check README badges are current
        run: pnpm badges:check

      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: apps/pgp/test-results
          retention-days: 7
