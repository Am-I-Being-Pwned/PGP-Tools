name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Build & E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/pgp/gpg-wasm

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM module
        working-directory: apps/pgp/gpg-wasm
        run: wasm-pack build --target web --release

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgp-tools-chrome-mv3
          path: apps/pgp/.output/chrome-mv3

      # E2E drives the built extension (.output/chrome-mv3, from `pnpm build`
      # above) in real Chromium via Playwright's new headless mode, which
      # loads extensions with no display/xvfb needed.
      - name: Install Playwright Chromium
        working-directory: apps/pgp
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e

      # The README's badge row is generated from measured values, never
      # typed. This re-measures and fails if the committed row has
      # drifted -- a badge is a claim in the first screenful, so it must
      # not be able to go quietly stale. It runs here, after the
      # Playwright install, because counting the e2e tests goes through
      # `playwright test --list`.
      - name: Check README badges are current
        working-directory: apps/pgp
        # Run directly in the package rather than through turbo: the root
        # scripts are turbo tasks, and a coverage task would need its own
        # pipeline entry and output caching for one 13-second run.
        run: |
          pnpm coverage
          pnpm badges:check

      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/pgp/test-results
          retention-days: 7
